[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "asyncssh>=2.22.0",
    "boto3>=1.42.29",
    "celery>=5.6.2",
    "clerk-backend-api>=4.2.0",
    "fastapi>=0.128.0",
    "flower>=2.0.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "uvicorn>=0.40.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rlx_api"]
